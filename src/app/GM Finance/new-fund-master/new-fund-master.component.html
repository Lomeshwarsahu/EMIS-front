<div class="supplier-po-page">
  <h2 class="page-title wide">New Fund Master</h2>

  <div class="entry-card">
    <form #fundEntryForm="ngForm" (ngSubmit)="onSaveNewFund(fundEntryForm)" novalidate>
                        
                        <div class="mb-4">
                            <label class="form-label fw-bold text-muted small">Enter New Fund Name <span class="text-danger">*</span></label>
                            <div class="input-group shadow-sm">
                                <span class="input-group-text bg-light text-secondary border-end-0"><i class="bi bi-bank"></i></span>
                                <input type="text" class="form-control border-start-0 shadow-none text-uppercase fw-semibold" 
                                       placeholder="e.g., NHM FINANCIAL GRANT..." 
                                       [(ngModel)]="newFundNameString" name="newFund" #newFund="ngModel" required
                                       [ngClass]="{'is-invalid': newFund.invalid && (newFund.dirty || newFund.touched)}">
                            </div>
                            
                            <div class="text-danger small fw-bold mt-1.5 ms-1 animate__animated animate__fadeIn" *ngIf="newFund.invalid && (newFund.dirty || newFund.touched)">
                                <i class="bi bi-exclamation-triangle-fill me-1"></i> Please specify a valid non-empty fund configuration title!
                            </div>
                        </div>

                        <div class="pt-2 border-top gap-2 d-flex">
                            <button type="submit" class="btn px-4 py-2 rounded-pill shadow-sm fw-bold d-inline-flex align-items-center justify-content-center add-btn"
                                    [disabled]="fundEntryForm.invalid">
                                <i class="bi bi-check-circle-fill me-1.5"></i> Add New Fund
                            </button>
                            <button type="button" class="btn btn-outline-secondary px-3 py-2 rounded-pill shadow-sm fw-medium" 
                                    (click)="fundEntryForm.resetForm()">
                                <i class="bi bi-x-circle"></i> 
                            </button>
                        </div>

                    </form>
  </div>

  <div class="datagrid">
    <div class="table-toolbar filters">
      <input type="text" class="toolbar-search" placeholder="Search..." aria-label="Filter rows" (keyup)="applyInstantSearchFilter($event)" />
    </div>

    <div class="table-wrap">
      <table class="po-grid">
          <thead>
              <tr>
                  <th class="text-center" style="width: 90px;">S.No</th>
                  <th>Registered Fund Nomenclature</th>
              </tr>
          </thead>
          <tbody>
              <tr *ngFor="let fund of filteredFundsList | slice: pager.start : pager.end; let i = index" class="grid-row-effect">
                  <td class="text-center text-muted fw-bold small py-2.5">
                      {{ pager.start + i + 1 }}
                  </td>
                  <td class="fw-bold text-dark-emphasis small px-4 letter-spacing-05 text-wrap">
                      {{ fund.Budgetname | uppercase }}
                  </td>
              </tr>

              <tr *ngIf="!filteredFundsList || filteredFundsList.length === 0">
                  <td colspan="2" class="text-center py-5 text-muted bg-white">
                      <div class="py-4">
                          <i class="bi bi-folder-x text-secondary opacity-25 fs-1 mb-2 d-block"></i>
                          No matched grants funds configurations records located inside master lookup files.
                      </div>
                  </td>
              </tr>
          </tbody>
      </table>
      <mat-paginator *ngIf="filteredFundsList.length" [length]="filteredFundsList.length" [pageIndex]="pager.index" [pageSize]="pager.size"
        [pageSizeOptions]="pager.sizes" (page)="pager.onPage($event)" showFirstLastButtons></mat-paginator>
    </div>
  </div>

</div>

<div class="supplier-po-page">
  <h2 class="page-title wide">Tender Status Item Wise</h2>

  <div class="datagrid">
    <div class="table-toolbar filters">
      <ng-select [items]="itemlist" bindLabel="item_name" bindValue="item_id" appendTo="body" [(ngModel)]="selecteditem" name="selecteditem" placeholder="Select Item" (change)="onSelectedyearlist($event)"></ng-select>
      <button type="button" class="show-btn" (click)="GetItemsWiseDetails()" [disabled]="!Item_id">Show Data</button>
      <input type="text" class="toolbar-search" placeholder="Search..." aria-label="Filter rows" (keyup)="applyTextFilter($event)" />
      <button type="button" class="export-btn" (click)="exporter.exportTable('xlsx', { fileName: 'TenderStatusItemWise', sheet: 'TenderStatusItemWise', Props: { Author: 'cgmsc' }})">Export Excel</button>
    </div>

    <div class="table-wrap">
                                          <table class="po-grid" mat-table
                                              matTableExporter [dataSource]="dataSource" #exporter="matTableExporter" matSort
                                              #sort="matSort">

                                              <ng-container matColumnDef="sno">
                                                  <th mat-header-cell *matHeaderCellDef mat-sort-header> S.No </th>
                                                  <td mat-cell *matCellDef="let element" class="text-center">
                                                      {{element.sno}} </td>
                                              </ng-container>
                                              <ng-container matColumnDef="TenderNo">
                                                  <th mat-header-cell *matHeaderCellDef mat-sort-header>Tender No</th>
                                                  <td mat-cell *matCellDef="let element" class="text-center">
                                                      {{element.TenderNo}} </td>
                                              </ng-container>
                                              <ng-container matColumnDef="TenderDate">
                                                  <th mat-header-cell *matHeaderCellDef mat-sort-header>Tender Date</th>
                                                  <td mat-cell *matCellDef="let element" class="text-center">
                                                      {{element.TenderDate}} </td>
                                              </ng-container>
                                              <ng-container matColumnDef="EndDate">
                                                  <th mat-header-cell *matHeaderCellDef mat-sort-header>Tender Submission Last Date</th>
                                                  <td mat-cell *matCellDef="let element" class="text-center">
                                                    {{element.EndDate}} </td> 
                                                   <!-- <span class="d-flex  flex-row-center p-2 ">
                                                          <a type="link" class="download-link text-info text-center" (click)="GetitemFulldetail(element.FacilityAutId,element.POtype,element.FacilityAutName)"> {{element.NosPO}} 
                                                          </a>
                                                      </span></td> -->
                                              </ng-container>
                                              <ng-container matColumnDef="ItemCodeAsPerTender">
                                                  <th mat-header-cell *matHeaderCellDef mat-sort-header>Item Code</th>
                                                  <td mat-cell *matCellDef="let element" class="text-center">
                                                      {{element.ItemCodeAsPerTender}}
                                                  </td>
                                              </ng-container>
                                              <ng-container matColumnDef="ItemName">
                                                  <th mat-header-cell *matHeaderCellDef mat-sort-header>Name</th>
                                                  <td mat-cell *matCellDef="let element" class="text-center">
                                                      {{element.ItemName}} </td>
                                              </ng-container>
                                              <ng-container matColumnDef="FinalStatus">
                                                  <th mat-header-cell *matHeaderCellDef mat-sort-header>Tender Status</th>
                                                  <td mat-cell *matCellDef="let element" class="text-center">
                                                      {{element.FinalStatus}} </td>
                                              </ng-container>



      <!-- 
                                              <ng-container matColumnDef="action">
                            <th mat-header-cell *matHeaderCellDef mat-sort-header>Download IDetails</th>
                            <td mat-cell *matCellDef="let element" class="text-center">
                              <span class="d-flex  flex-row-reverse p-2 ">
                                <button
                                  class="btn btn-sm text-light align-items-center border rounded btn-outline-info-subtle  bg-info-subtle"
                                  mat-button (click)="onButtonClick(element.PoId)">
                                  <i class="bi bi-arrow-down text-primary"></i>
                                </button>
                              </span>
                            </td>
                          </ng-container> -->

                                              <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                                              <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
                                          </table>
                                          <mat-paginator #paginator [pageSizeOptions]="[5,10, 15, 30]"
                                              showFirstLastButtons></mat-paginator>
    </div>
  </div>
</div>

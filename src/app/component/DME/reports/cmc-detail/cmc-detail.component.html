<div class="dme-cmc-page">
  <div class="datagrid">
    <div class="table-toolbar filters filters--compact">
      <select
        aria-label="Item Name"
        [(ngModel)]="selectedItemCode"
        name="selectedItemCode"
        (ngModelChange)="onItemChange()"
        [class.is-placeholder]="selectedItemCode === '0'">
        <option *ngFor="let i of itemOptions" [ngValue]="i.ItemCodeAsPerTender">{{ i.ItemName }}</option>
      </select>

      <select
        aria-label="Tender No"
        [(ngModel)]="selectedTenderId"
        name="selectedTenderId"
        [disabled]="!selectedItemCode || selectedItemCode === '0' || tendersLoading"
        [class.is-placeholder]="selectedTenderId === 0">
        <option [ngValue]="0">{{ tendersLoading ? 'Loading…' : 'Select Tender' }}</option>
        <option *ngFor="let t of tenderOptions" [ngValue]="t.TenderId">{{ t.TenderNo }}</option>
      </select>

      <button type="button" class="show-btn" (click)="show()" [disabled]="loading">
        {{ loading ? 'Loading…' : 'Show' }}
      </button>
      <button type="button" class="show-btn accent-btn" (click)="exportExcel()" [disabled]="loading || !rows.length">
        Export
      </button>
    </div>

    <div class="table-wrap">
      <table class="cmc-grid emis-full-width-table">
        <colgroup>
          <col class="col-sn" />
          <col class="col-code" />
          <col class="col-name" />
          <col class="col-tender" />
          <col class="col-cmc" />
          <col class="col-cmc" />
          <col class="col-cmc" />
          <col class="col-cmc" />
          <col class="col-cmc" />
        </colgroup>
        <thead>
          <tr>
            <th class="text-center">S.No</th>
            <th>Code</th>
            <th>Item Name</th>
            <th>Tender No</th>
            <th class="text-center">CMC1</th>
            <th class="text-center">CMC2</th>
            <th class="text-center">CMC3</th>
            <th class="text-center">CMC4</th>
            <th class="text-center">CMC5</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let row of rows; index as i" [class.alt-row]="i % 2 === 1">
            <td class="text-center">{{ i + 1 }}</td>
            <td>{{ row.ItemCodeAsPerTender || '—' }}</td>
            <td>{{ row.ItemName || '—' }}</td>
            <td>{{ row.TenderNo || '—' }}</td>
            <td class="text-center">{{ row.Cmc1 }}</td>
            <td class="text-center">{{ row.Cmc2 }}</td>
            <td class="text-center">{{ row.Cmc3 }}</td>
            <td class="text-center">{{ row.Cmc4 }}</td>
            <td class="text-center">{{ row.Cmc5 }}</td>
          </tr>
          <tr *ngIf="loading">
            <td colspan="9" class="empty-row">Loading…</td>
          </tr>
          <tr *ngIf="!loading && !rows.length">
            <td colspan="9" class="empty-row">
              <div class="empty-state">
                <p>No CMC detail found. Select filters and click Show.</p>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

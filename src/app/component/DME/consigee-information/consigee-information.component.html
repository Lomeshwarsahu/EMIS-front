<div class="consignee-page">
  <div class="header-strip">Equipment Essential List - Consignee</div>

  <div class="card">
    <div class="card-title">Update Consignee Information</div>
    <div class="subtitle">Medical College / Hospital Contact Details</div>

    <div class="meta-row">
      <div class="meta-label">UserID (for Login)</div>
      <div class="meta-value">{{ model.LoginEmail || '—' }}</div>
      <div class="meta-actions">
        <button (click)="load()" class="btn small">Refresh</button>
      </div>
    </div>

    <form class="form-grid" (ngSubmit)="save()">
      <div class="form-col">
        <label for="deanName">Dean / Superintendent Name</label>
        <input id="deanName" name="deanName" type="text" [(ngModel)]="model.DeanName" />

        <label for="storeOfficer">Store Officer</label>
        <input id="storeOfficer" name="storeOfficer" type="text" [(ngModel)]="model.StoreOfficerName" />

        <label for="officeEmail">Email (office)</label>
        <input id="officeEmail" name="officeEmail" type="email" [(ngModel)]="model.OfficeEmail" />

        <label for="addr1">Address Line 1</label>
        <input id="addr1" name="addr1" type="text" [(ngModel)]="model.AddressLine1" />
      </div>

      <div class="form-col">
        <label for="deanMobile">Dean Mobile No</label>
        <input id="deanMobile" name="deanMobile" type="text" [(ngModel)]="model.DeanMobile" />

        <label for="storeMobile">Store Officer Mobile No (for login & indent finalization)</label>
        <input id="storeMobile" name="storeMobile" type="text" [(ngModel)]="model.StoreOfficerMobile" />

        <label for="officePhone">Contact No (office)</label>
        <input id="officePhone" name="officePhone" type="text" [(ngModel)]="model.OfficeContactNo" />

        <label for="addr2">Address Line 2</label>
        <textarea id="addr2" name="addr2" rows="2" [(ngModel)]="model.AddressLine2"></textarea>
      </div>

      <div class="form-grid single">
        <div class="form-col wide">
          <label for="addr3">Address Line 3</label>
          <textarea id="addr3" name="addr3" rows="2" [(ngModel)]="model.AddressLine3"></textarea>
        </div>
      </div>

      <div class="actions-row">
        <button type="submit" class="btn primary" [disabled]="saving || loading">{{ saving ? 'Saving…' : 'Update Contacts' }}</button>
      </div>
    </form>
  </div>
</div>

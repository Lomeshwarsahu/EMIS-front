<div class="page-wrapper">
  <div class="top-bar">
    <div class="actions">
      <button type="button" class="circle-btn white" aria-label="Fullscreen">⛶</button>
      <button type="button" class="circle-btn cyan" (click)="load()" aria-label="Refresh">↻</button>
      <button type="button" class="circle-btn orange" aria-label="Minimize">−</button>
    </div>
  </div>

  <div class="content-card">
    <div class="title-box">
      Medical College/Hospital Contact Details
      <span *ngIf="loading" class="text-muted ms-2">Loading…</span>
    </div>

    <hr />

    <div class="row">
      <div class="label">UserID (for Login)</div>
      <div class="value blue-link">{{ model.LoginEmail || '—' }}</div>
    </div>

    <hr />

    <div class="grid-row">
      <div class="field">
        <label for="deanName">Dean/Superintendent Name</label>
        <input id="deanName" type="text" [(ngModel)]="model.DeanName" name="deanName" />
      </div>

      <div class="field">
        <label for="deanMobile">Dean Mobile No</label>
        <input id="deanMobile" type="text" [(ngModel)]="model.DeanMobile" name="deanMobile" />
      </div>
    </div>

    <hr />

    <div class="grid-row">
      <div class="field">
        <label for="storeOfficer">Store Officer</label>
        <input id="storeOfficer" type="text" [(ngModel)]="model.StoreOfficerName" name="storeOfficer" />
      </div>

      <div class="field">
        <label for="storeMobile">Store Officer Mobile No (login & indent)</label>
        <input id="storeMobile" type="text" [(ngModel)]="model.StoreOfficerMobile" name="storeMobile" />
      </div>
    </div>

    <div class="close-text" *ngIf="model.LocationName">
      {{ model.LocationName }}
    </div>

    <hr />

    <div class="grid-row">
      <div class="field">
        <label for="officeEmail">Email (office)</label>
        <input id="officeEmail" type="email" [(ngModel)]="model.OfficeEmail" name="officeEmail" />
      </div>

      <div class="field">
        <label for="officePhone">Contact No (office)</label>
        <input id="officePhone" type="text" [(ngModel)]="model.OfficeContactNo" name="officePhone" />
      </div>
    </div>

    <hr />

    <div class="grid-row single">
      <div class="field wide">
        <label for="addr1">Address Line 1</label>
        <input id="addr1" type="text" [(ngModel)]="model.AddressLine1" name="addr1" />
      </div>
    </div>

    <hr />

    <div class="grid-row single">
      <div class="field wide">
        <label for="addr2">Address Line 2</label>
        <textarea id="addr2" rows="2" [(ngModel)]="model.AddressLine2" name="addr2"></textarea>
      </div>
    </div>

    <hr />

    <div class="grid-row single">
      <div class="field wide">
        <label for="addr3">Address Line 3</label>
        <textarea id="addr3" rows="2" [(ngModel)]="model.AddressLine3" name="addr3"></textarea>
      </div>
    </div>

    <hr />

    <div class="btn-wrapper">
      <button type="button" class="update-btn" (click)="save()" [disabled]="saving || loading">
        {{ saving ? 'Saving…' : 'Update Contacts' }}
      </button>
    </div>
  </div>

  <div class="gear-box" aria-hidden="true">⚙</div>
</div>

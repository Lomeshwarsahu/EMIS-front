<div class="contact-page">
  <app-dme-page-skeleton *ngIf="loading" type="form" [rows]="10" />

  <ng-container *ngIf="!loading">
    <form class="form-card" (ngSubmit)="save()">
      <div class="section-head">
        <h2 class="section-title">Contact Information</h2>
        <button type="button" class="ghost-btn" (click)="load()" [disabled]="saving">Refresh</button>
      </div>

      <div class="form-grid">
        <label class="field">
          <span class="field-label">Dean / Superintendent Name <em>*</em></span>
          <input
            type="text"
            name="deanName"
            [(ngModel)]="model.DeanName"
            autocomplete="name"
            [disabled]="saving" />
        </label>

        <label class="field">
          <span class="field-label">Dean Mobile No <em>*</em></span>
          <input
            type="text"
            name="deanMobile"
            [(ngModel)]="model.DeanMobile"
            inputmode="numeric"
            maxlength="15"
            (keypress)="digitsOnly($event)"
            [disabled]="saving" />
        </label>

        <label class="field">
          <span class="field-label">Store Officer <em>*</em></span>
          <input
            type="text"
            name="storeOfficer"
            [(ngModel)]="model.StoreOfficerName"
            [disabled]="saving" />
        </label>

        <label class="field">
          <span class="field-label">Store Officer Mobile No <em>*</em></span>
          <input
            type="text"
            name="storeMobile"
            [(ngModel)]="model.StoreOfficerMobile"
            inputmode="numeric"
            maxlength="15"
            (keypress)="digitsOnly($event)"
            [disabled]="saving" />
          <span class="field-hint">Used for login &amp; indent finalization OTP</span>
        </label>

        <label class="field">
          <span class="field-label">Email (office) <em>*</em></span>
          <input
            type="email"
            name="officeEmail"
            [(ngModel)]="model.OfficeEmail"
            autocomplete="email"
            [disabled]="saving" />
        </label>

        <label class="field">
          <span class="field-label">Contact No (office)</span>
          <input
            type="text"
            name="officePhone"
            [(ngModel)]="model.OfficeContactNo"
            inputmode="tel"
            [disabled]="saving" />
        </label>

        <label class="field field-span-2">
          <span class="field-label">Address Line 1 <em>*</em></span>
          <input type="text" name="addr1" [(ngModel)]="model.AddressLine1" [disabled]="saving" />
        </label>

        <label class="field field-span-2">
          <span class="field-label">Address Line 2 <em>*</em></span>
          <textarea
            name="addr2"
            rows="2"
            [(ngModel)]="model.AddressLine2"
            [disabled]="saving"></textarea>
        </label>

        <label class="field field-span-2">
          <span class="field-label">Address Line 3</span>
          <textarea
            name="addr3"
            rows="2"
            [(ngModel)]="model.AddressLine3"
            [disabled]="saving"></textarea>
        </label>
      </div>

      <div class="actions-row">
        <button type="submit" class="primary-btn" [disabled]="saving || !model.UserId">
          {{ saving ? 'Updating…' : 'Update Contacts' }}
        </button>
      </div>
    </form>
  </ng-container>
</div>

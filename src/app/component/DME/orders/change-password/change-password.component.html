<div class="ems-legacy-page">
  <div class="header-wrap">
    <span class="header-bar narrow">Change Password</span>
  </div>

  <div *ngIf="loading" class="grid-empty">Loading user details…</div>

  <div *ngIf="!loading" class="password-form">
    <div class="grid-empty note-red" style="text-align: left">{{ reason }}</div>

    <table class="panel-table">
      <tbody>
        <tr>
          <td class="label-col"><strong>User Name</strong></td>
          <td>{{ userName || userId }}</td>
          <td class="label-col"><strong>Mobile Number</strong></td>
          <td>
            <input type="text" class="legacy-input" [(ngModel)]="mobile" [disabled]="saving" />
          </td>
        </tr>
        <tr>
          <td class="label-col"><strong>Email Id</strong></td>
          <td>
            <input type="text" class="legacy-input" [(ngModel)]="email" [disabled]="saving" />
          </td>
          <td></td>
          <td></td>
        </tr>
        <tr>
          <td class="label-col"><strong>OTP</strong></td>
          <td>
            <input type="text" maxlength="4" class="legacy-input" [(ngModel)]="otp" [disabled]="saving" />
          </td>
          <td></td>
          <td>
            <button type="button" class="btn-legacy" (click)="sendOtp()" [disabled]="sendingOtp || saving">
              {{ sendingOtp ? 'Sending…' : 'Send OTP' }}
            </button>
          </td>
        </tr>
        <tr>
          <td class="label-col"><strong>New Password</strong></td>
          <td>
            <input type="password" class="legacy-input" [(ngModel)]="newPassword" [disabled]="saving" />
          </td>
          <td class="label-col"><strong>Confirm Password</strong></td>
          <td>
            <input type="password" class="legacy-input" [(ngModel)]="confirmPassword" [disabled]="saving" />
          </td>
        </tr>
        <tr>
          <td colspan="4" class="center">
            <button type="button" class="btn-legacy" (click)="changePassword()" [disabled]="saving || !otpSent">
              {{ saving ? 'Saving…' : 'Change Password' }}
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

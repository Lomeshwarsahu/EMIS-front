<div class="legacy-page">
  <div class="legacy-title">Receipt/Installation Desk</div>

  <div class="legacy-card">
    <table>
      <thead>
        <tr>
          <th>S.No</th>
          <th>Item Code</th>
          <th>Equipment Name</th>
          <th>PO No</th>
          <th>Consignee</th>
          <th>PO Qty For Consignee</th>
          <th>Supplied Qty</th>
          <th>Balance Qty</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let row of rows; index as i">
          <td>{{ i + 1 }}</td>
          <td>{{ row.itemCode }}</td>
          <td>{{ row.equipmentName }}</td>
          <td>{{ row.poNo }}</td>
          <td>{{ row.consignee }}</td>
          <td>{{ row.poQtyForConsignee }}</td>
          <td>{{ row.suppliedQty }}</td>
          <td>{{ row.balanceQty }}</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

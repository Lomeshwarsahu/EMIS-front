<div class="it-page">
  <h2 class="page-title">DHS Facility Users &amp; Locations</h2>

  <div class="datagrid">
    <div class="table-toolbar filters--compact">
      <select
        aria-label="District"
        [(ngModel)]="selectedDistrictId"
        name="district"
        [disabled]="loading">
        <option [ngValue]="0">Select District</option>
        <option *ngFor="let d of districts" [ngValue]="d.DP_DistrictID">
          {{ d.DBStart_Name_En }}
        </option>
      </select>

      <select
        aria-label="Facility Type"
        [(ngModel)]="selectedFacilityTypeId"
        name="facilityType"
        [disabled]="loading">
        <option [ngValue]="0">Select Facility Type</option>
        <option *ngFor="let ft of facilityTypes" [ngValue]="ft.FacilityTypeId">
          {{ ft.FacilityTypeName }}
        </option>
      </select>

      <button
        type="button"
        class="show-btn"
        [disabled]="loading"
        (click)="loadGrid()">
        Show
      </button>
    </div>

    <app-dme-page-skeleton *ngIf="loading" type="table" [rows]="6" [cols]="5" />

    <div class="table-wrap" *ngIf="!loading">
      <table
        class="it-grid"
        mat-table
        [dataSource]="dataSource"
        matSort
        #sort="matSort">
        <ng-container matColumnDef="sno">
          <th mat-header-cell *matHeaderCellDef mat-sort-header class="text-center">S.No</th>
          <td mat-cell *matCellDef="let row; let i = index" class="text-center">{{ i + 1 }}</td>
        </ng-container>

        <ng-container matColumnDef="locationName">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Location Name</th>
          <td mat-cell *matCellDef="let row">{{ row.LocationName }}</td>
        </ng-container>

        <ng-container matColumnDef="district">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>District</th>
          <td mat-cell *matCellDef="let row">{{ row.District }}</td>
        </ng-container>

        <ng-container matColumnDef="emailId">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Email</th>
          <td mat-cell *matCellDef="let row">{{ row.EmailId }}</td>
        </ng-container>

        <ng-container matColumnDef="userId">
          <th mat-header-cell *matHeaderCellDef mat-sort-header class="text-center">User ID</th>
          <td mat-cell *matCellDef="let row" class="text-center">{{ row.UserId }}</td>
        </ng-container>

        <ng-container matColumnDef="action">
          <th mat-header-cell *matHeaderCellDef class="text-center">Action</th>
          <td mat-cell *matCellDef="let row" class="text-center">
            <button
              *ngIf="!row.UserId || row.UserId === 0"
              type="button"
              class="show-btn"
              (click)="addFacility(row.LocationId)">
              Add
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>

      <div class="empty-row" *ngIf="!dataSource.data.length">
        No DHS facilities found. Select filters and click Show.
      </div>
    </div>
  </div>
</div>

<div class="supplier-po-page">
  <h2 class="page-title wide">Year Wise PO Abstract for Directorate</h2>

  <div class="datagrid">
    <div class="table-toolbar filters">
      <ng-select [items]="yearlist" bindLabel="year" bindValue="financial_year_id" appendTo="body" [(ngModel)]="financial_year_id" name="financial_year_id" placeholder="Select year" (change)="onSelectedyearlist($event)"> </ng-select>
      <button type="button" class="show-btn" (click)="GetFinanceRep()">Show Data</button>
      <input type="text" class="toolbar-search" placeholder="Search..." aria-label="Search" (keyup)="applyTextFilter($event)" />
      <button type="button" class="export-btn" (click)="exporter.exportTable('xlsx', { fileName: 'PODetails', sheet: 'PODetails', Props: { Author: 'cgmsc' }})">Export Excel</button>
    </div>

    <div class="table-wrap">
      <table class="po-grid" mat-table
                                        matTableExporter [dataSource]="dataSource" #exporter="matTableExporter" matSort
                                        #sort="matSort">

                                        <ng-container matColumnDef="sno">
                                            <th mat-header-cell *matHeaderCellDef mat-sort-header> S.No </th>
                                            <td mat-cell *matCellDef="let element" class="text-center">
                                                {{element.sno}} </td>
                                        </ng-container>
                                        <ng-container matColumnDef="FacilityAutName">
                                            <th mat-header-cell *matHeaderCellDef mat-sort-header>Directorate</th>
                                            <td mat-cell *matCellDef="let element" class="text-center">
                                                {{element.FacilityAutName}} </td>
                                        </ng-container>
                                        <ng-container matColumnDef="NosItem">
                                            <th mat-header-cell *matHeaderCellDef mat-sort-header>No of Item</th>
                                            <td mat-cell *matCellDef="let element" class="text-center">
                                                {{element.NosItem}} </td>
                                        </ng-container>
                                        <ng-container matColumnDef="NosPO">
                                            <th mat-header-cell *matHeaderCellDef mat-sort-header>No of PO</th>
                                            <td mat-cell *matCellDef="let element" class="text-center">
                                              
                                             <span class="d-flex  flex-row-center p-2 ">
                                                    <a type="link" class="download-link text-info text-center" (click)="GetitemFulldetail(element.FacilityAutId,element.POtype,element.FacilityAutName)"> {{element.NosPO}} 
                                                    </a>
                                                </span></td>
                                        </ng-container>
                                        <ng-container matColumnDef="POtype">
                                            <th mat-header-cell *matHeaderCellDef mat-sort-header>PO Type</th>
                                            <td mat-cell *matCellDef="let element" class="text-center">
                                                {{element.POtype}}
                                            </td>
                                        </ng-container>
                                        <ng-container matColumnDef="TotalPOValueCr">
                                            <th mat-header-cell *matHeaderCellDef mat-sort-header>PO Value (in Cr)</th>
                                            <td mat-cell *matCellDef="let element" class="text-center">
                                                {{element.TotalPOValueCr}} </td>
                                        </ng-container>

                                      



                                        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                                        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
                                    </table>
    </div>
    <mat-paginator #paginator [pageSizeOptions]="[5,10, 15, 30]" showFirstLastButtons></mat-paginator>
  </div>
</div>

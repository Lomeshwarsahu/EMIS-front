<div class="supplier-po-page">

  <div class="emis-modal-backdrop" *ngIf="showEntryForm" (click)="closeEntryForm()"></div>
  <div class="emis-modal emis-modal--sm" *ngIf="showEntryForm" role="dialog" aria-modal="true" aria-label="Add Program">
    <div class="emis-modal-header">
      <h5>Add Program</h5>
      <button type="button" class="btn-close" aria-label="Close" (click)="closeEntryForm()"></button>
    </div>
    <div class="emis-modal-body">
<form [formGroup]="mappingForm" (ngSubmit)="onSubmit()">
    <div class="row align-items-end g-3">
        
        <div class="col-12 col-md-5">
            <label class="form-label fw-semibold text-muted small">
                Search & Select Directorate <span class="text-danger">*</span>
            </label>
            <ng-select [items]="FacilityList"  class="form-control"
                       appendTo="body" 
                       bindLabel="FacilityAutCode"
                       bindValue="FacilityAutId" 
                       formControlName="directorateId"
                       placeholder="Select Directorate...">
            </ng-select>
            <div *ngIf="mappingForm.get('directorateId')?.invalid && mappingForm.get('directorateId')?.touched"
                 class="text-danger mt-1 small">
                Directorate is required.
            </div>
        </div>

        <div class="col-12 col-md-5">
            <label class="form-label fw-semibold text-muted small">
                Enter Program Name <span class="text-danger">*</span>
            </label>
            <input type="text" 
                   class="form-control py-2" 
                   formControlName="programName"
                   placeholder="Enter Program Name..." />
            <div *ngIf="mappingForm.get('programName')?.invalid && mappingForm.get('programName')?.touched"
                 class="text-danger mt-1 small">
                Program Name is required.
            </div>
        </div>

        <div class="col-12 col-md-2 text-md-end">
            <button type="submit" 
                    class="btn btn-primary w-100 py-2 shadow-sm fw-bold"
                    [disabled]="mappingForm.invalid">
                <i class="bi bi-cloud-arrow-up me-2"></i> Save & Add
            </button>
        </div>

    </div>
</form>
  
    </div>
  </div>

  <div class="datagrid">
    <div class="table-toolbar filters">
      <input type="text" class="toolbar-search" placeholder="Search..." aria-label="Search" (keyup)="applyTextFilter($event)" />
      <button type="button" class="add-btn" (click)="openEntryForm()">+ Add Program</button>
    </div>

    <div class="table-wrap">
      <table class="po-grid" mat-table [dataSource]="dataSource" matSort   style="width: 100% !important;">

                    <ng-container matColumnDef="sno">
                        <th mat-header-cell *matHeaderCellDef class="text-center"> S.No </th>
                        <td mat-cell *matCellDef="let element" class="text-center text-muted"> {{element.sno}} </td>
                    </ng-container>

                    <ng-container matColumnDef="FacilityAutCode">
                        <th mat-header-cell *matHeaderCellDef class="">Directorate</th>
                        <td mat-cell *matCellDef="let element" class="fw-semibold text-primary"> {{element.FacilityAutCode}} </td>
                    </ng-container>
                    <ng-container matColumnDef="ProgramName">
                        <th mat-header-cell *matHeaderCellDef class="">Program </th>
                        <td mat-cell *matCellDef="let element"> {{element.ProgramName}} </td>
                    </ng-container>

                    <ng-container matColumnDef="CreatedOn">
                        <th mat-header-cell *matHeaderCellDef class="text-center">Entry Date </th>
                        <td mat-cell *matCellDef="let element" class="text-center"> <span class="badge bg-secondary">{{element.CreatedOn}}</span> </td>
                    </ng-container>
                   

                    <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
                    <tr mat-row *matRowDef="let row; columns: displayedColumns;">
                    </tr>
                </table>
    </div>
    <mat-paginator #paginator class="bg-transparent" [pageSizeOptions]="[10, 25, 50]" showFirstLastButtons></mat-paginator>
  </div>
</div>

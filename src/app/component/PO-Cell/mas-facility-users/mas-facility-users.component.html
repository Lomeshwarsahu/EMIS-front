    <div class="card shadow-sm border-0 rounded-3">
        <div class="card-body p-3">
            
         
               <div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-3">
                
                <div class="input-group shadow-sm" style="max-width: 300px;">
                    <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-search"></i></span>
                    <input type="text" class="form-control border-start-0 ps-0" placeholder="Search suppliers..." (keyup)="applyTextFilter($event)">
                </div>

                <!-- <div>
                    <button class="btn btn-outline-success shadow-sm" mat-button [matMenuTriggerFor]="exportMenu">
                        <i class="bi bi-file-earmark-excel me-1"></i> Export
                    </button>
                    <mat-menu #exportMenu="matMenu">

                            <i class="bi bi-file-excel text-success me-2"></i> Download Excel
                        </button>
                    </mat-menu>
                </div> -->
            </div>
            <div class="table-responsive border rounded" style="max-height: 500px; overflow-y: auto;">
                <table class="table table-hover align-middle mb-0"  mat-table matTableExporter [dataSource]="dataSource" #exporter="matTableExporter" matSort #sort="matSort"  style="width: 100% !important;">

                    <ng-container matColumnDef="sno">
                        <th mat-header-cell *matHeaderCellDef class="bg-light text-secondary text-center"> S.No </th>
                        <td mat-cell *matCellDef="let element" class="text-center text-muted"> {{element.sno}} </td>
                    </ng-container>

                    <ng-container matColumnDef="FacilityTypeId">
                        <th mat-header-cell *matHeaderCellDef class="bg-light text-secondary">Facility Type Id</th>
                        <td mat-cell *matCellDef="let element" class="fw-semibold text-primary"> {{element.FacilityTypeId}} </td>
                    </ng-container>

                    <ng-container matColumnDef="FacilityTypeName">
                        <th mat-header-cell *matHeaderCellDef class="bg-light text-secondary">Facility Type</th>
                        <td mat-cell *matCellDef="let element"> {{element.FacilityTypeName}} </td>
                    </ng-container>

                    <ng-container matColumnDef="NoOfConsignee">
                        <th mat-header-cell *matHeaderCellDef class="bg-light text-secondary text-center">No Of Consignee </th>
                        <td mat-cell *matCellDef="let element" class="text-center"> <span class="badge bg-secondary">{{element.NoOfConsignee}}</span> </td>
                    </ng-container>
                    <ng-container matColumnDef="NoOfUser">
                        <th mat-header-cell *matHeaderCellDef class="bg-light text-secondary text-center">No Of User </th>
                        <td mat-cell *matCellDef="let element" class="text-center"> <span class="badge bg-secondary">{{element.NoOfUser}}</span> </td>
                    </ng-container>
                      <ng-container matColumnDef="Addlocation">
                        <th mat-header-cell *matHeaderCellDef class="bg-light text-center"> Add Location </th>
                        <td mat-cell *matCellDef="let element" class="text-center">
                            <button class="btn btn-sm btn-light border text-primary" mat-button (click)="AddLocation(element.FacilityTypeId,element.Authority)">
                               Add Location
                            </button>
                        </td>
                    </ng-container>
                    <!-- <ng-container matColumnDef="Addlocation">
                        <th mat-header-cell *matHeaderCellDef class="bg-light text-secondary text-center">Add Location </th>
                        <td mat-cell *matCellDef="let element" class="text-center"> <span class="badge text-primary">
                               <button class="btn btn-sm btn-light border text-primary" mat-button (click)="GetById(element.SupplierId)" title="Edit Supplier">
                                <i class="bi bi-pencil-square"></i>
                            </button>
                            
                            Add Location</span> </td>
                    </ng-container> -->
                    <ng-container matColumnDef="adduser">
                        <th mat-header-cell *matHeaderCellDef class="bg-light text-secondary text-center">Add User</th>
                        <td mat-cell *matCellDef="let element" class="text-center">
                              <button class="btn btn-sm btn-light border text-primary" mat-button (click)="AddLocation(element.FacilityTypeId,element.Authority)">
                               Make User ID
                            </button>
                           
                    </ng-container>

                    <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
                    <tr mat-row *matRowDef="let row; columns: displayedColumns;">
                    </tr>
                </table>
            </div>

            <div class="mt-2">
                <mat-paginator #paginator class="bg-transparent" [pageSizeOptions]="[10, 25, 50]" showFirstLastButtons></mat-paginator>
            </div>

        </div>
    </div>
</section>

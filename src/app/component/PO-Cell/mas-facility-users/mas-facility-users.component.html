<div class="supplier-po-page">

  <div class="datagrid">
    <div class="table-toolbar filters">
      <input type="text" class="toolbar-search" placeholder="Search..." aria-label="Search" (keyup)="applyTextFilter($event)" />
    </div>

    <div class="table-wrap">
      <table class="po-grid"  mat-table matTableExporter [dataSource]="dataSource" #exporter="matTableExporter" matSort #sort="matSort"  style="width: 100% !important;">

                    <ng-container matColumnDef="sno">
                        <th mat-header-cell *matHeaderCellDef class="text-center"> S.No </th>
                        <td mat-cell *matCellDef="let element" class="text-center text-muted"> {{element.sno}} </td>
                    </ng-container>

                    <ng-container matColumnDef="FacilityTypeId">
                        <th mat-header-cell *matHeaderCellDef class="text-center">Facility Type Id</th>
                        <td mat-cell *matCellDef="let element" class="fw-semibold text-primary"> {{element.FacilityTypeId}} </td>
                    </ng-container>

                    <ng-container matColumnDef="FacilityTypeName">
                        <th mat-header-cell *matHeaderCellDef class="text-center">Facility Type</th>
                        <td mat-cell *matCellDef="let element"> {{element.FacilityTypeName}} </td>
                    </ng-container>

                    <ng-container matColumnDef="NoOfConsignee">
                        <th mat-header-cell *matHeaderCellDef class="text-center">No Of Consignee </th>
                        <td mat-cell *matCellDef="let element" class="text-center"> {{element.NoOfConsignee}} </td>
                    </ng-container>
                    <ng-container matColumnDef="NoOfUser">
                        <th mat-header-cell *matHeaderCellDef class="text-center">No Of User </th>
                        <td mat-cell *matCellDef="let element" class="text-center"> {{element.NoOfUser}} </td>
                    </ng-container>
                      <ng-container matColumnDef="Addlocation">
                        <th mat-header-cell *matHeaderCellDef class="text-center"> Add Location </th>
                        <td mat-cell *matCellDef="let element" class="text-center">
                            <button class="btn btn-sm border text-primary add-btn" mat-button (click)="AddLocation(element.FacilityTypeId,element.Authority)">
                               Add Location
                            </button>
                        </td>
                    </ng-container>
                    
                    <ng-container matColumnDef="adduser">
                        <th mat-header-cell *matHeaderCellDef class="text-center">Add User</th>
                        <td mat-cell *matCellDef="let element" class="text-center">
                              <button class="btn btn-sm btn-light border text-primary" mat-button (click)="AddLocation(element.FacilityTypeId,element.Authority)">
                               Make User ID
                            </button>
                        </td>
                    </ng-container>

                    <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
                    <tr mat-row *matRowDef="let row; columns: displayedColumns;">
                    </tr>
                </table>
    </div>
    <mat-paginator #paginator class="bg-transparent" [pageSizeOptions]="[10, 25, 50]" showFirstLastButtons></mat-paginator>
  </div>
</div>

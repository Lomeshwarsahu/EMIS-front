<section class="container-fluid bg-light min-vh-100 py-4 px-lg-5">
    
    <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
        <div>
    <h2 class="fw-bold text-primary mb-1">
        <i class="bi bi-chat-dots me-2"></i> Pre Bid Entry
    </h2>
    <p class="text-muted mb-0 small">Record pre-bid meeting details, supplier queries, and official clarifications for this tender.</p>
</div>
       
        <button class="btn btn-outline-primary btn-sm rounded-pill px-3 shadow-sm" (click)="goBack()">
            <i class="bi bi-arrow-left me-1"></i> Back to Dashboard
        </button>
    </div>

    <div class="card shadow-sm border-0 rounded-4 mb-4 overflow-hidden">
        <div class="card-header bg-white py-3 border-bottom-0">
            <h6 class="fw-bold text-secondary mb-0">
                <i class="bi bi-info-circle-fill text-primary me-2"></i>Tender Reference
            </h6>
        </div>
        <div class="table-responsive px-3 pb-3">
            <table class="table table-sm table-borderless align-middle mb-0 bg-light rounded-3">
                <thead class="text-muted small text-uppercase">
                    <tr>
                        <th class="ps-3 py-2">Tender No.</th>
                        <th class="py-2">Release Date</th>
                        <th class="py-2 pe-3">Brief Description</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td class="ps-3 fw-bold text-primary">{{TenderDetails.TENDER_NO}}</td>
                        <td><span class="badge bg-white text-dark border shadow-xs px-2">{{TenderDetails.TENDER_DATE}}</span></td>
                        <td class="pe-3 text-truncate" style="max-width: 400px;">{{TenderDetails.TENDER_DESCRIPTION}}</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="card shadow-sm border-0 rounded-4 mb-4 border-top border-primary border-4">
       <div class="card-body bg-light bg-opacity-50">
         <form #penaltyForm="ngForm">
        <div class="row g-3 mb-4 animate__animated animate__fadeIn">
            <div class="col-12">
                <h6 class="fw-bold text-primary border-bottom pb-2">
                    <i class="bi bi-shield-exclamation me-2"></i>Cancellation & Penalty Terms
                </h6>
            </div>

            <div class="col-12 col-md-6 col-lg-4">
                <div class="form-floating shadow-sm">
                    <input type="number" class="form-control border" id="canDays" placeholder="Days" name="canDays">
                    <label for="canDays">Select HOD</label>
                </div>
            </div>

            <div class="col-12 col-md-6 col-lg-4">
                <div class="form-floating shadow-sm">
                    <input type="date" class="form-control border" id="canPercent" placeholder="%" name="canPercent">
                    <label for="canPercent">Send Date</label>
                </div>
            </div>

            <div class="col-12 col-md-6 col-lg-4">
                <div class="form-floating shadow-sm">
                    <input type="date" class="form-control border" id="penalty1" placeholder="%" name="penalty60_120">
                    <label for="penalty1">Letter Date</label>
                </div>
            </div>

          

            <div class="col-12 col-md-6 col-lg-4">
                <div class="form-floating shadow-sm">
                    <input type="text" class="form-control border" id="penalty2" placeholder="%" name="penalty121_180">
                    <label for="penalty2">Letter Number</label>
                </div>
            </div>

            <div class="col-12 col-md-6 col-lg-4">
                <div class="form-floating shadow-sm">
                    <textarea type="number" class="form-control border" id="logoCharges" placeholder="Amount" name="logoCharges"></textarea>
                    <label for="logoCharges">Remarks</label>
                </div>
            </div>

            <div class="col-12 col-md-6 col-lg-4">
                <div class="form-floating shadow-sm">
                    <input type="file" class="form-control border" id="logoLimit" placeholder="Limit" name="logoLimit">
                    <label for="logoLimit">Select File(.pdf Max 2 mb Size)</label>
                </div>
            </div>
        </div>

       

        <div class="row">
            <div class="col-12 d-flex justify-content-center pt-3 border-top gap-3">
                <button type="submit" class="btn btn-success px-5 shadow-sm rounded-pill fw-bold">
                    <i class="bi bi-save me-2"></i> Save Data
                </button>
                <button type="button" (click)="reset()" class="btn btn-outline-secondary px-4 rounded-pill fw-semibold">
                    <i class="bi bi-arrow-counterclockwise me-2"></i> Reset
                </button>
                <button type="button" (click)="goBack()" class="btn btn-outline-danger px-4 rounded-pill fw-semibold">
                    <i class="bi bi-arrow-left me-2"></i> Go Back
                </button>
            </div>
        </div>
    </form> 

  
</div> 
    </div>

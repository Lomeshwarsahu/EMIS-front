<div class="supplier-po-page">
  <div class="detail-section wide">
    <app-tender-page-header [tenderId]="tenderNo"></app-tender-page-header>

    <h3 class="section-title">List of Suppliers Participated in Tenders</h3>
    <div class="datagrid">
      <div class="table-wrap">
        <table class="po-grid">
          <thead>
            <tr>
              <th class="text-center">S.No</th>
              <th class="text-start">Supplier</th>
              <th class="text-end">EMD Amount</th>
              <th class="text-end">TP Amount</th>
              <th class="text-center">EMD Doc Type</th>
              <th class="text-start">EMD No</th>
              <th class="text-start">Remark</th>
              <th class="text-center">Participated Items</th>
              <th class="text-center">Add Items</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let row of bidders; let i = index">
              <td class="text-center">{{ i + 1 }}</td>
              <td class="text-start wrap-cell">{{ row.SupplierName }}</td>
              <td class="text-end">{{ row.Emd }}</td>
              <td class="text-end">{{ row.TpAmount }}</td>
              <td class="text-center">{{ docTypeName(row.EmdDocType) }}</td>
              <td class="text-start wrap-cell">{{ row.EmdDocNo }}</td>
              <td class="text-start wrap-cell">{{ row.Remark }}</td>
              <td class="text-center">
                <button type="button" class="link-btn-plain" (click)="openParticipatedItems(row)">{{ row.PItems }}</button>
              </td>
              <td class="text-center">
                <button type="button" class="link-btn-plain" (click)="openAddItems(row)">Add Items</button>
              </td>
            </tr>
            <tr *ngIf="!bidders.length">
              <td colspan="9" class="empty-row">No Records Found</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

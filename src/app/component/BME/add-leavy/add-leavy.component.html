<section class="container-fluid bg-light min-vh-100 py-4 px-lg-5">
    
    <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
        <div>
            <h2 class="fw-bold text-primary mb-1">
                <i class="bi bi-exclamation-triangle me-2"></i> Add Levy / Penalty
            </h2>
            <p class="text-muted mb-0 small">Manage and apply penalty charges or levies for this specific tender.</p>
        </div>
        <button class="btn btn-outline-primary btn-sm rounded-pill px-3 shadow-sm" (click)="goBack()">
            <i class="bi bi-arrow-left me-1"></i> Back to Dashboard
        </button>
    </div>

    <div class="card shadow-sm border-0 rounded-4 mb-4 overflow-hidden">
        <div class="card-header bg-white py-3 border-bottom-0">
            <h6 class="fw-bold text-secondary mb-0">
                <i class="bi bi-info-circle-fill text-primary me-2"></i>Tender Reference
            </h6>
        </div>
        <div class="table-responsive px-3 pb-3">
            <table class="table table-sm table-borderless align-middle mb-0 bg-light rounded-3">
                <thead class="text-muted small text-uppercase">
                    <tr>
                        <th class="ps-3 py-2">Tender No.</th>
                        <th class="py-2">Release Date</th>
                        <th class="py-2 pe-3">Brief Description</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td class="ps-3 fw-bold text-primary">{{TenderDetails.TENDER_NO}}</td>
                        <td><span class="badge bg-white text-dark border shadow-xs px-2">{{TenderDetails.TENDER_DATE}}</span></td>
                        <td class="pe-3 text-truncate" style="max-width: 400px;">{{TenderDetails.TENDER_DESCRIPTION}}</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="card shadow-sm border-0 rounded-4 mb-4 border-top border-primary border-4">
       <div class="card-body bg-light bg-opacity-50">
        <form #penaltyForm="ngForm" (ngSubmit)="onSubmit(penaltyForm)">
    <div class="row g-3 mb-4 animate__animated animate__fadeIn">
        <div class="col-12">
            <h6 class="fw-bold text-primary border-bottom pb-2">
                <i class="bi bi-shield-exclamation me-2"></i>Cancellation & Penalty Terms
            </h6>
        </div>

        <!-- <div class="col-12 col-md-6 col-lg-3">
            <div class="form-floating shadow-sm">
                <input type="number" class="form-control border" name="CancellationDays" [(ngModel)]="levyData.CancellationDays" required>
                <label>Cancellation Days</label>
            </div>
        </div> -->
        <div class="col-12 col-md-6 col-lg-3">
            <div class="form-floating shadow-sm">
                <input type="number" class="form-control border" name="CancellationDays" [(ngModel)]="levyData.CancellationDays" required>
                <label>Cancellation Days</label>
            </div>
        </div>
        <div class="col-12 col-md-6 col-lg-3">
            <div class="form-floating shadow-sm">
                <input type="number" class="form-control border" name="CancellationPercentage" [(ngModel)]="levyData.CancellationPercentage" required>
                <label>Cancellation Percent (%)</label>
            </div>
        </div>

        <div class="col-12 col-md-6 col-lg-3">
            <div class="form-floating shadow-sm">
                <input type="number" class="form-control border" name="PenaltyPercent" [(ngModel)]="levyData.PenaltyPercent" required>
                <label>Penalty % (>60 & <120)</label>
            </div>
        </div>
              <div class="col-12 col-md-6 col-lg-3">
            <label class="form-label fw-semibold text-muted small d-block">Penalty Type</label>
            <div class="btn-group w-100 shadow-sm rounded" role="group">
                <input type="radio" class="btn-check" name="PenaltyType" id="pDays" value="D" [(ngModel)]="levyData.PenaltyType">
                <label class="btn btn-outline-primary border-0" for="pDays">Days</label>
                
                <input type="radio" class="btn-check" name="PenaltyType" id="pWeeks" value="W" [(ngModel)]="levyData.PenaltyType">
                <label class="btn btn-outline-primary border-0" for="pWeeks">Weeks</label>
            </div>
        </div>
        <!-- <div class="col-12 col-md-6 col-lg-3">
            <label class="form-label fw-semibold text-muted small d-block">Penalty Type</label>

                <input type="radio" class="btn-check" name="PenaltyType" id="pDays" value="Days" [(ngModel)]="levyData.PenaltyType">
                <label class="btn btn-outline-primary border-0" for="pDays">Days</label>
                
                <input type="radio" class="btn-check" name="PenaltyType" id="pWeeks" value="Week" [(ngModel)]="levyData.PenaltyType">
                <label class="btn btn-outline-primary border-0" for="pWeeks">Weeks</label>
            </div>
        </div> -->

        <div class="col-12 col-md-6 col-lg-4">
            <div class="form-floating shadow-sm">
                <input type="number" class="form-control border" name="PenaltyPercent120" [(ngModel)]="levyData.PenaltyPercent120" required>
                <label>Penalty % (121-180 Days)</label>
            </div>
        </div>

        <div class="col-12 col-md-6 col-lg-4">
            <div class="form-floating shadow-sm">
                <input type="number" class="form-control border" name="LogoCharges" [(ngModel)]="levyData.LogoCharges" required>
                <label>Logo Charges (₹)</label>
            </div>
        </div>

        <div class="col-12 col-md-6 col-lg-4">
            <div class="form-floating shadow-sm">
                <input type="number" class="form-control border" name="LogoChargesUpper" [(ngModel)]="levyData.LogoChargesUpper" required>
                <label>Logo Upper Limit (₹)</label>
            </div>
        </div>
    </div>

    <div class="row g-3 mb-4">
        <!-- <div class="col-12 col-md-6 col-lg-4">
            <label class="form-label small text-muted fw-bold">20% Release Type</label>
            <div class="d-flex gap-2">

                    <label class="btn btn-outline-success w-100 border" [for]="'rel'+opt">{{opt}}</label>
                </div>
            </div>
        </div> -->
        <div class="col-12 col-md-6 col-lg-4">
            <label class="form-label small text-muted fw-bold">20% Release Type</label>
            <div class="d-flex gap-2">
                <div class="form-check flex-fill p-0">
                    <input class="btn-check" type="radio" name="ReleaseType" id="relM" value="M" [(ngModel)]="levyData.ReleaseType">
                    <label class="btn btn-outline-success w-100 border" for="relM">Month</label>
                </div>
                <div class="form-check flex-fill p-0">
                    <input class="btn-check" type="radio" name="ReleaseType" id="relW" value="W" [(ngModel)]="levyData.ReleaseType">
                    <label class="btn btn-outline-success w-100 border" for="relW">Week</label>
                </div>
                <div class="form-check flex-fill p-0">
                    <input class="btn-check" type="radio" name="ReleaseType" id="relN" value="N" [(ngModel)]="levyData.ReleaseType">
                    <label class="btn btn-outline-success w-100 border" for="relN">NR</label>
                </div>
            </div>
        </div>
        <div class="col-12 col-md-6 col-lg-4">
            <div class="form-floating shadow-sm">
                <input type="number" class="form-control border" name="ReleaseValue" [(ngModel)]="levyData.ReleaseValue">
                <label>Release Duration (No. of W/M)</label>
            </div>
        </div>
         <div class="col-12 col-md-6 col-lg-4">
            <label class="form-label small text-muted fw-bold">Performance Certificate Required?</label>
            <div class="d-flex gap-2">
                <div class="form-check flex-fill p-0">
                    <input class="btn-check" type="radio" name="PerformanceReq" id="perfY" value="Y" [(ngModel)]="levyData.PerformanceReq">
                    <label class="btn btn-outline-info w-100 border" for="perfY">Yes</label>
                </div>
                <div class="form-check flex-fill p-0">
                    <input class="btn-check" type="radio" name="PerformanceReq" id="perfN" value="N" [(ngModel)]="levyData.PerformanceReq">
                    <label class="btn btn-outline-info w-100 border" for="perfN">No</label>
                </div>
                <div class="form-check flex-fill p-0">
                    <input class="btn-check" type="radio" name="PerformanceReq" id="perfA" value="A" [(ngModel)]="levyData.PerformanceReq">
                    <label class="btn btn-outline-info w-100 border" for="perfA">N/A</label>
                </div>
            </div>
        </div>
        <!-- <div class="col-12 col-md-6 col-lg-4">
            <label class="form-label small text-muted fw-bold">Performance Certificate Required?</label>
            <div class="d-flex gap-2">
                <div class="form-check flex-fill p-0" *ngFor="let opt of ['Yes', 'No', 'NA']">
                    <input class="btn-check" type="radio" name="PerformanceReq" [id]="'perf'+opt" [value]="opt" [(ngModel)]="levyData.PerformanceReq">
                    <label class="btn btn-outline-info w-100 border" [for]="'perf'+opt">{{opt}}</label>
                </div>
            </div>
        </div> -->
    </div>

    <div class="row">
        <div class="col-12 d-flex justify-content-center pt-3 border-top gap-3">
            <button type="submit" class="btn btn-success px-5 shadow rounded-pill fw-bold" [disabled]="!penaltyForm.valid">
                <i class="bi bi-save me-2"></i> Save Data
            </button>
            <button type="button" (click)="reset()" class="btn btn-outline-secondary px-4 rounded-pill">Reset</button>
        </div>
    </div>
</form>

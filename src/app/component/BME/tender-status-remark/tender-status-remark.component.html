<div class="supplier-po-page">
  <div class="detail-section wide">
    <app-tender-page-header [tenderId]="tenderId"></app-tender-page-header>

    <div class="detail-form-card">
      <table class="detail-form-table">
        <tbody>
          <tr>
            <td class="label-col">Current Status <span class="req">*</span></td>
            <td class="value-col">
              <select aria-label="Current Status" name="tsId" [(ngModel)]="selectedTsId">
                <option [ngValue]="0">Select</option>
                <option *ngFor="let s of statusList" [ngValue]="s.TsId">{{ s.TenderStatus }}</option>
              </select>
            </td>
          </tr>
          <tr>
            <td class="label-col">Remarks <span class="req">*</span></td>
            <td class="value-col">
              <textarea rows="3" aria-label="Remarks" name="remarks" [(ngModel)]="remarks"></textarea>
            </td>
          </tr>
          <tr class="form-actions-row">
            <td colspan="2">
              <button type="button" class="show-btn" [disabled]="saving || !tenderId" (click)="save()">
                {{ saving ? 'Saving…' : 'Save' }}
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <h3 class="section-title section-gap">Status History</h3>
    <div class="datagrid">
      <div class="table-wrap">
        <table class="po-grid">
          <thead>
            <tr>
              <th class="text-center">SL No</th>
              <th class="text-start">Scheme Name</th>
              <th class="text-start">Current Status</th>
              <th class="text-start">Remarks</th>
              <th class="text-center">Entry Date</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let r of remarkList; let i = index">
              <td class="text-center">{{ i + 1 }}</td>
              <td class="text-start">{{ r.TenderNo }}</td>
              <td class="text-start">{{ r.TenderStatus }}</td>
              <td class="text-start wrap-cell">{{ r.TenderRemark }}</td>
              <td class="text-center">{{ r.EntryDate }}</td>
            </tr>
            <tr *ngIf="!remarkList.length">
              <td colspan="5" class="empty-row">No status added yet.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<div class="supplier-po-page">
  <h2 class="page-title wide">Item Mapping</h2>

  <div class="entry-card">
<form [formGroup]="mappingForm" (ngSubmit)="onSubmit()">
                <div class="row align-items-center g-3">
                    
                    <div class="col-12 col-md-4">
                        <label class="form-label fw-semibold text-muted small">Main Item Name <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" formControlName="MainItemType" placeholder="Enter Main Item Type Name">
                    </div>

                    <div class="col-6 col-md-2">
                        <label class="form-label fw-semibold text-muted small d-block">AMC Req.</label>
                        <div class="btn-group btn-group-sm w-100">
                            <input type="radio" class="btn-check" formControlName="AmcRequired" value="Y" id="amcY">
                            <label class="btn btn-outline-success" for="amcY">Yes</label>
                            <input type="radio" class="btn-check" formControlName="AmcRequired" value="N" id="amcN">
                            <label class="btn btn-outline-danger" for="amcN">No</label>
                        </div>
                    </div>

                    <div class="col-6 col-md-2">
                        <label class="form-label fw-semibold text-muted small d-block">Is Electrical</label>
                        <div class="btn-group btn-group-sm w-100">
                            <input type="radio" class="btn-check" formControlName="IsElectrical" value="Y" id="elecY">
                            <label class="btn btn-outline-success" for="elecY">Yes</label>
                            <input type="radio" class="btn-check" formControlName="IsElectrical" value="N" id="elecN">
                            <label class="btn btn-outline-danger" for="elecN">No</label>
                        </div>
                    </div>

                    <div class="col-6 col-md-2">
                        <label class="form-label fw-semibold text-muted small d-block">Progress Req.</label>
                        <div class="btn-group btn-group-sm w-100">
                            <input type="radio" class="btn-check" formControlName="ProgressRequired" value="Y" id="progY">
                            <label class="btn btn-outline-success" for="progY">Yes</label>
                            <input type="radio" class="btn-check" formControlName="ProgressRequired" value="N" id="progN">
                            <label class="btn btn-outline-danger" for="progN">No</label>
                        </div>
                    </div>

                    <div class="col-6 col-md-2">
                        <label class="form-label fw-semibold text-muted small d-block">Entry Type</label>
                        <div class="btn-group btn-group-sm w-100">
                            <input type="radio" class="btn-check" formControlName="EntryType" value="S" id="entS">
                            <label class="btn btn-outline-primary" for="entS">Serial</label>
                            <input type="radio" class="btn-check" formControlName="EntryType" value="B" id="entB">
                            <label class="btn btn-outline-secondary" for="entB">Bulk</label>
                        </div>
                    </div>
                </div>

                <div class="d-flex justify-content-end mt-3 pt-3 border-top">
                    <button type="submit" class="btn btn-primary px-5 shadow-sm" [disabled]="mappingForm.invalid || selectedItems.length === 0">
                        <i class="bi bi-link-45deg me-2"></i> Map Selected Items
                    </button>
                </div>
            </form>
  </div>

  <div class="datagrid">
    <div class="table-toolbar filters">
      <input type="text" class="toolbar-search" placeholder="Search..." aria-label="Search" (keyup)="applyTextFilter($event)" />
      <span class="selected-count">{{ selectedItems.length }} Selected</span>
    </div>

    <div class="table-wrap">
      <table class="po-grid" mat-table matTableExporter [dataSource]="dataSource" #exporter="matTableExporter" matSort #sort="matSort">

                    <ng-container matColumnDef="select">
                        <th mat-header-cell *matHeaderCellDef class="text-center" style="width: 50px;">
                            <input class="form-check-input" type="checkbox" (change)="toggleAll($event)">
                        </th>
                        <td mat-cell *matCellDef="let element" class="text-center">
                            <input class="form-check-input" type="checkbox" [checked]="isSelected(element.ItemId)" (change)="toggleSelection(element.ItemId)">
                        </td>
                    </ng-container>
                    <ng-container matColumnDef="sno">
                        <th mat-header-cell *matHeaderCellDef class="text-center"> S.No </th>
                        <td mat-cell *matCellDef="let element; let i = index" class="text-center text-muted"> {{i + 1}} </td>
                    </ng-container>

                    <ng-container matColumnDef="ItemCodeAsPerTender">
                        <th mat-header-cell *matHeaderCellDef class="">ItemCodeAsPerTender</th>
                        <td mat-cell *matCellDef="let element" class="fw-semibold"> {{element.ItemCodeAsPerTender}} </td>
                    </ng-container>

                    <ng-container matColumnDef="ItemName">
                        <th mat-header-cell *matHeaderCellDef class=""> Equipment Name </th>
                        <td mat-cell *matCellDef="let element"> {{element.ItemName}} </td>
                    </ng-container>
                    <ng-container matColumnDef="ItemId">
                        <th mat-header-cell *matHeaderCellDef class="">Item Id </th>
                        <td mat-cell *matCellDef="let element"> {{element.ItemId}} </td>
                    </ng-container>

                    <tr mat-header-row *matHeaderRowDef="['select', 'sno', 'ItemCodeAsPerTender', 'ItemName']; sticky: true"></tr>
                    <tr mat-row *matRowDef="let row; columns: ['select', 'sno', 'ItemCodeAsPerTender', 'ItemName'];" 
                        (click)="toggleSelection(row.ItemId)" style="cursor: pointer;" 
                        [class.bg-primary]="isSelected(row.ItemId)" [class.bg-opacity-10]="isSelected(row.ItemId)">
                    </tr>
                </table>
    </div>
  </div>
</div>

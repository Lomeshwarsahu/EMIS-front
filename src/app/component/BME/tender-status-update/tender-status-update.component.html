
<section class="container-fluid bg-light min-vh-100 py-4 px-lg-5">
<div class="d-flex flex-row justify-content-between align-items-start mb-4 px-2 animate__animated animate__slideInDown">
    <div class="pe-2">
        <h2 class="fw-bold text-primary mb-1 fs-4 fs-md-2">
            <i class="bi bi-arrow-repeat me-1 me-md-2"></i>Tender Status Update
        </h2>
        <p class="text-muted mb-0 fs-7 fs-md-6 d-none d-sm-block">Complete the information below to update tender reports.</p>
        <p class="text-muted mb-0 fs-7 d-block d-sm-none">Update tender details below.</p>
    </div>

    <div class="flex-shrink-0">
        <button class="btn btn-outline-primary rounded-pill px-2 px-md-4 py-1 py-md-2 shadow-sm fw-bold border-2 hover-zoom d-flex align-items-center" (click)="goBack()">
            <i class="bi bi-arrow-left fs-6"></i>
            <span class="ms-1 d-none d-sm-inline small">Back to List</span>
            <span class="ms-1 d-inline d-sm-none small" style="font-size: 0.75rem;">Back</span>
        </button>
    </div>
</div>
    <div class="card shadow-lg border-0 rounded-4 mb-4 animate__animated animate__fadeInUp animate__faster">
        <div class="card-header bg-white border-bottom py-3 d-flex align-items-center justify-content-between">
            <h5 class="fw-bold text-primary mb-0">
                <i class="bi bi-pencil-square me-2 text-info"></i> Update Contract Details
            </h5>
            <span class="badge rounded-pill bg-primary-subtle text-primary border border-primary-subtle px-3">Live Editing</span>
        </div>

        <div class="card-body p-4 p-lg-5">
             <form>
                <div class="row g-4 mb-5 animate__animated animate__fadeInLeft animate__delay-1s">
                    <div class="col-12">
                        <div class="d-flex align-items-center mb-2">
                            <span class="badge bg-primary px-3 py-2 rounded-pill shadow-sm">01</span>
                            <h6 class="ms-2 mb-0 fw-bold text-dark">Basic Identification</h6>
                        </div>
                        <hr class="mt-0 opacity-10">
                    </div>
                    
                    <div class="col-12 col-md-6 col-lg-3">
                        <label class="form-label fw-bold text-secondary small">Tender No <span class="text-danger">*</span></label>
                        <textarea rows="1" class="form-control border-2 shadow-none focus-ring focus-ring-primary" placeholder="Enter No"
                         name="tenderno" required style="resize: none;" [(ngModel)]="TenderDetails.TENDER_NO"></textarea>
                    </div>

                    <div class="col-12 col-md-6 col-lg-3">
                        <label class="form-label fw-bold text-secondary small">Tender ID <span class="text-danger">*</span></label>
                        <textarea rows="1" class="form-control border-2 shadow-none focus-ring focus-ring-primary" [(ngModel)]="TenderDetails.tender_id" placeholder="Enter ID" name="tid" required style="resize: none;"></textarea>
                    </div>

                    <div class="col-12 col-md-6 col-lg-3">
                        <label class="form-label fw-bold text-secondary small">eProc Tender No <span class="text-danger">*</span></label>
                        <textarea rows="1" class="form-control border-2 shadow-none focus-ring focus-ring-primary" placeholder="Enter eProc No" [(ngModel)]="TenderDetails.eprocID" name="epno" required style="resize: none;"></textarea>
                    </div>
                  
                    <div class="col-12 col-md-6 col-lg-3">
                        <label class="form-label fw-bold text-secondary small">CGMSC Upload ID <span class="text-danger">*</span></label>
                        <div class="input-group shadow-sm">
                            <textarea rows="1" class="form-control border-2 border-end-0 shadow-none focus-ring focus-ring-primary" placeholder="eProc No"
                             [(ngModel)]="TenderDetails.webSiteUploadID" name="cgmid" required style="resize: none;"></textarea>
                            <button class="btn btn-primary fw-bold px-3 d-flex align-items-center" type="button" (click)="updateEProc()">
                                <i class="bi bi-arrow-repeat me-1"></i> Update
                            </button>
                        </div>
                    </div>
                </div>

                <div class="row g-4 mb-5 animate__animated animate__fadeInLeft animate__delay-1s">
                    <div class="col-12">
                        <div class="d-flex align-items-center mb-2">
                            <span class="badge bg-info px-3 py-2 rounded-pill shadow-sm">02</span>
                            <h6 class="ms-2 mb-0 fw-bold text-dark">Timeline & Dates</h6>
                        </div>
                        <hr class="mt-0 opacity-10">
                    </div>

                    <div class="col-12 col-md-6 col-lg-3">
                        <label class="form-label fw-bold text-secondary small">Start Date</label>
                        <input type="date" class="form-control border-2 shadow-none focus-ring focus-ring-info" 
                        name="sdate" [(ngModel)]="TenderDetails.TENDER_DATE"  required>
                    </div>

                    <div class="col-12 col-md-6 col-lg-3">
                        <label class="form-label fw-bold text-secondary small">End Date</label>
                        <input type="date" class="form-control border-2 shadow-none focus-ring focus-ring-info"
                         name="edate" [(ngModel)]="TenderDetails.ENDDate" required>
                    </div>

                
                    <div class="col-12 col-md-6 col-lg-3">
                        <label class="form-label fw-bold text-warning small">Extended Date</label>
                        <input type="date" class="form-control border-2 shadow-none" name="exdate" [(ngModel)]="TenderDetails.exdate"
                            required>
                    </div>
                    <div class="col-12 col-md-6 col-lg-3">
                        <label class="form-label fw-bold text-danger small">Cancelled Date</label>
                        <input type="date" class="form-control border-2 border-danger-subtle shadow-none focus-ring focus-ring-danger" 
                        name="candate" [(ngModel)]="TenderDetails.TENDER_NO" required>
                    </div>

                    <div class="col-12 col-md-4 col-lg-4">
                        <label class="form-label fw-bold text-secondary small border-bottom border-2 border-primary-subtle w-100 mb-2 pb-1">Cover A Date</label>
                        <input type="date" class="form-control border-2 shadow-none focus-ring focus-ring-primary" 
                        name="cadate" [(ngModel)]="TenderDetails.cover_a" required>
                    </div>
                    <div class="col-12 col-md-4 col-lg-4">
                        <label class="form-label fw-bold text-secondary small border-bottom border-2 border-primary-subtle w-100 mb-2 pb-1">Cover B Date</label>
                        <input type="date" class="form-control border-2 shadow-none focus-ring focus-ring-primary" name="cbdate" [(ngModel)]="TenderDetails.cover_b" required>
                    </div>
                    <div class="col-12 col-md-4 col-lg-4">
                        <label class="form-label fw-bold text-secondary small border-bottom border-2 border-primary-subtle w-100 mb-2 pb-1">Cover C Date</label>
                        <input type="date" class="form-control border-2 shadow-none focus-ring focus-ring-primary" name="ccdate"  [(ngModel)]="TenderDetails.cover_c" required>
                    </div>
                </div>

                <div class="row g-3 mb-5 animate__animated animate__fadeInLeft animate__delay-1s">
                    <div class="col-12 col-md-4">
                        <div class="p-3 border-2 border rounded-3 bg-white shadow-sm border-primary-subtle">
                            <label class="form-label fw-bold text-primary small mb-2 d-block"><i class="bi bi-display me-1"></i>Demo Date 1</label>
                            <input type="date" class="form-control border-0 bg-light" name="D1date" [(ngModel)]="TenderDetails.cover_Demo" required>
                        </div>
                    </div>
                    <div class="col-12 col-md-4">
                        <div class="p-3 border-2 border rounded-3 bg-white shadow-sm border-primary-subtle">
                            <label class="form-label fw-bold text-primary small mb-2 d-block"><i class="bi bi-display me-1"></i>Demo Date 2</label>
                            <input type="date" class="form-control border-0 bg-light" name="D2date" [(ngModel)]="TenderDetails.cover_Demo2" required>
                        </div>
                    </div>
                    <div class="col-12 col-md-4">
                        <div class="p-3 border-2 border rounded-3 bg-white shadow-sm border-primary-subtle">
                            <label class="form-label fw-bold text-primary small mb-2 d-block"><i class="bi bi-display me-1"></i>Demo Date 3</label>
                            <input type="date" class="form-control border-0 bg-light" name="cd3date" [(ngModel)]="TenderDetails.cover_Demo3" required>
                        </div>
                    </div>
                </div>

                <div class="row g-4 mb-5 animate__animated animate__fadeInLeft animate__delay-2s">
                    <div class="col-12">
                        <div class="d-flex align-items-center mb-2">
                            <span class="badge bg-success px-3 py-2 rounded-pill shadow-sm">03</span>
                            <h6 class="ms-2 mb-0 fw-bold text-dark">Technical Specifications</h6>
                        </div>
                        <hr class="mt-0 opacity-10">
                    </div>

                    <div class="col-12 col-md-6 col-lg-3">
                        <label class="form-label fw-bold text-secondary small">Financial Year</label>
                        <input type="text" class="form-control border-2 shadow-none focus-ring focus-ring-success" placeholder="e.g. 2024-25" name="fyear" [(ngModel)]="TenderDetails.FINANCIAL_YEAR" required>
                    </div>

                <div class="col-12 col-md-6 col-lg-3">
                    <label class="form-label fw-bold text-primary small">Tender Status</label>
                    <ng-select class="border-2 rounded shadow-none form-control" appendTo="body" [items]="CoverStatusList"
                        bindLabel="cstatus" bindValue="csid" placeholder="Select Status" [(ngModel)]="TenderDetails.csid" name="csid"
                        required>
                    </ng-select>
                </div>
                <div class="col-12 col-md-6 col-lg-2">
                    <label class="form-label fw-bold text-secondary small">Warranty (Yrs)</label>
                    <input type="number" class="form-control border-2 shadow-none focus-ring focus-ring-success" placeholder="0"
                        name="iwiy" [(ngModel)]="TenderDetails.warranty_year" required>
                </div>

                    <div class="col-12 col-md-6 col-lg-2">
                        <label class="form-label fw-bold text-secondary small">Supply (Dom.)</label>
                        <input type="number" class="form-control border-2 shadow-none focus-ring focus-ring-success" placeholder="Days" name="sdde" [(ngModel)]="TenderDetails.domestic_days" required>
                    </div>

                    <div class="col-12 col-md-6 col-lg-2">
                        <label class="form-label fw-bold text-secondary small">Supply (Intl.)</label>
                        <input type="number" class="form-control border-2 shadow-none focus-ring focus-ring-success" placeholder="Days" name="sdie" [(ngModel)]="TenderDetails.import_days" required>
                    </div>
                </div>

                <div class="row g-4 mb-5 animate__animated animate__fadeInLeft animate__delay-2s">
                    <div class="col-12 col-lg-6">
                        <label class="form-label fw-bold text-secondary small">Tender Description</label>
                        <textarea rows="2" class="form-control border-2 shadow-none focus-ring focus-ring-primary bg-light-subtle" placeholder="Enter description..."
                        [(ngModel)]="TenderDetails.TENDER_DESCRIPTION" name="TDescription" required></textarea>
                    </div>
                    <div class="col-12 col-lg-6">
                        <label class="form-label fw-bold text-secondary small">Remarks</label>
                        <textarea rows="2" class="form-control border-2 shadow-none focus-ring focus-ring-primary bg-light-subtle" placeholder="Enter any additional remarks..." name="Remarks" 
                        [(ngModel)]="TenderDetails.TenderRemarks"
                        required></textarea>
                    </div>
                </div>

                <div class="d-flex flex-wrap justify-content-center gap-4 pt-5 border-top animate__animated animate__fadeInUp animate__delay-2s">
                    <button type="submit" class="btn btn-primary btn-lg px-5 rounded-pill shadow-lg fw-bold d-flex align-items-center transition-all hover-grow"
                    (click)="saveFullDetails()">
                        <i class="bi bi-cloud-arrow-up-fill me-2 fs-5"></i>Update & Publish
                    </button>
                    <button type="button" class="btn btn-outline-danger btn-lg px-5 rounded-pill border-2 fw-bold d-flex align-items-center shadow-sm"
                    (click)="fetchTenderDetails(tenderNo)">
                        <i class="bi bi-trash3 me-2"></i>Reset Form
                    </button>
                </div>

            </form>
        </div>
    </div>
</section>

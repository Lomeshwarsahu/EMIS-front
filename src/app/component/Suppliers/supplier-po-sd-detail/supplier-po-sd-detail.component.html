<div class="supplier-po-page sd-detail-page">
  <div class="page-toolbar">
    <a class="back-link" (click)="goBack()">Back</a>
  </div>

  <h2 class="page-title narrow">
    SD Detail
    <span *ngIf="isViewOnly" class="submitted-badge">Submitted</span>
  </h2>

  <app-supplier-page-skeleton *ngIf="loading" type="form" [formFields]="8" />

  <div *ngIf="!loading" class="sd-detail-wrap">
    <div class="sd-detail-card">
      <table class="sd-form-table">
        <tbody>
          <tr class="sd-info-row">
            <td class="label-col">Equipment</td>
            <td class="value-col" colspan="3">{{ equipmentName }}</td>
          </tr>
          <tr class="sd-info-row">
            <td class="label-col">Gross Value</td>
            <td class="value-col" colspan="3">{{ grossValue | number: '1.2-2' }}</td>
          </tr>
          <tr>
            <td class="label-col">Payment Mode</td>
            <td class="value-col">
              <select [(ngModel)]="selectedPaymentMode" name="paymentMode" [disabled]="isViewOnly">
                <option value="0">select</option>
                <option *ngFor="let mode of paymentModes" [value]="mode.sdMode">
                  {{ mode.sdName }}
                </option>
              </select>
            </td>
            <td class="label-col">Issue Date</td>
            <td class="value-col">
              <input type="date" [(ngModel)]="issueDate" name="issueDate" [disabled]="isViewOnly" />
            </td>
          </tr>
          <tr>
            <td class="label-col">SD Amount</td>
            <td class="value-col">
              <input type="text" [value]="sdAmount" disabled />
            </td>
            <td class="label-col">
              Maturity Date
              <span *ngIf="!isMaturityOptional" class="req-mark">*</span>
              <span *ngIf="isMaturityOptional" class="optional-mark">(optional)</span>
            </td>
            <td class="value-col">
              <input type="date" [(ngModel)]="maturityDate" name="maturityDate" [disabled]="isViewOnly" />
            </td>
          </tr>
          <tr>
            <td class="label-col">Document No</td>
            <td class="value-col" colspan="3">
              <input
                type="text"
                [(ngModel)]="documentNo"
                name="documentNo"
                maxlength="100"
                [disabled]="isViewOnly || hasExisting"
              />
            </td>
          </tr>
          <tr *ngIf="showUpdate" class="file-mode-row">
            <td colspan="4">
              <label>
                <input
                  type="radio"
                  name="fileMode"
                  value="UPLOAD"
                  [(ngModel)]="fileMode"
                  (change)="onFileModeChange()"
                />
                Upload File
              </label>
              <label>
                <input
                  type="radio"
                  name="fileMode"
                  value="VIEW"
                  [(ngModel)]="fileMode"
                  (change)="onFileModeChange()"
                />
                View File
              </label>
            </td>
          </tr>
          <tr class="upload-row">
            <td colspan="4">
              <input
                *ngIf="showFileUpload"
                type="file"
                accept=".pdf,application/pdf"
                (change)="onFileSelected($event)"
              />
              <button
                *ngIf="(showUpdate && fileMode === 'VIEW' && hasFile) || (isViewOnly && hasFile)"
                type="button"
                class="show-btn small-btn"
                (click)="downloadFile()"
              >
                View File
              </button>
              <small *ngIf="showFileUpload">Max 3 MB, PDF only</small>
            </td>
          </tr>
          <tr class="form-actions-row">
            <td colspan="4">
              <button *ngIf="showSubmit" type="button" class="show-btn" (click)="save()" [disabled]="saving">
                {{ saving ? 'Saving...' : 'Submit' }}
              </button>
              <button *ngIf="showUpdate" type="button" class="show-btn" (click)="update()" [disabled]="saving">
                {{ saving ? 'Saving...' : 'Update' }}
              </button>
              <button
                *ngIf="!isViewOnly"
                type="button"
                class="show-btn secondary-btn"
                (click)="resetForm()"
                [disabled]="saving">
                Reset
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<div class="emis-app-shell">
  <ngx-spinner bdColor="rgba(0, 0, 0, 0.8)" size="medium" color="#fff" type="line-scale-party" [fullScreen]="true">
    <p style="color: white"> Please wait... </p>
  </ngx-spinner>

  <mat-drawer-container
    class="main-container"
    [class.main-container--login]="isLoginPage"
    [autosize]="true">

    <mat-drawer
      #drawer
      class="premium-drawer"
      [class.premium-drawer--collapsed]="sidebarCollapsed"
      [class.premium-drawer--dark-collapsed]="sidebarCollapsed && themeService.isDark"
      [mode]="drawerMode"
      [opened]="isDrawerOpen && !isLoginPage"
      (openedChange)="onDrawerOpenedChange($event)">
      <app-app-sidebar
        [menuItems]="menuItems"
        [expandedMenus]="expandedMenus"
        [menuSearch]="menuSearchQuery"
        [collapsed]="sidebarCollapsed"
        [activeUrl]="router.url"
        (submenuToggle)="toggleSubmenu($event)"
        (navigate)="closeDrawerOnNavigate()"
        (logoutClick)="logout(); closeDrawerOnNavigate()"
        (collapsedChange)="onSidebarCollapsedChange($event)" />
    </mat-drawer>

    <mat-drawer-content class="main-drawer-content">
      <header
        class="app-shell-header"
        [class.theme-dark]="themeService.isDark"
        *ngIf="!isLoginPage">
        <button
          type="button"
          class="header-icon-btn mobile-menu-btn"
          *ngIf="isMobile"
          (click)="toggleDrawer()"
          [attr.aria-label]="isDrawerOpen ? 'Close menu' : 'Open menu'">
          <mat-icon>{{ isDrawerOpen ? 'close' : 'menu' }}</mat-icon>
        </button>

        <h1 class="header-page-title" *ngIf="pageHeading">{{ pageHeading }}</h1>

        <div class="header-actions">
          <div class="header-search-wrap header-search-wrap--actions">
            <div class="header-search" [class.is-focused]="menuSearchFocused">
              <mat-icon class="header-search-icon">search</mat-icon>
              <input
                type="search"
                class="header-search-input"
                [(ngModel)]="menuSearchQuery"
                (input)="onMenuSearchInput()"
                (focus)="onMenuSearchFocus()"
                (blur)="onMenuSearchBlur()"
                placeholder="Search menu"
                aria-label="Search menu"
                autocomplete="off"
                role="combobox"
                [attr.aria-expanded]="menuSearchFocused && menuSearchQuery.trim().length > 0"
                aria-controls="menu-search-suggestions" />
            </div>

            <ul
              id="menu-search-suggestions"
              class="header-search-suggestions"
              *ngIf="menuSearchFocused && menuSearchQuery.trim() && menuSearchSuggestions.length"
              role="listbox">
              <li *ngFor="let suggestion of menuSearchSuggestions" role="option">
                <button
                  type="button"
                  class="header-search-suggestion"
                  (mousedown)="selectMenuSuggestion(suggestion); $event.preventDefault()">
                  <mat-icon aria-hidden="true">subdirectory_arrow_right</mat-icon>
                  <span class="suggestion-text">
                    <span class="suggestion-label">{{ suggestion.label }}</span>
                    <span class="suggestion-parent" *ngIf="suggestion.parentLabel">{{ suggestion.parentLabel }}</span>
                  </span>
                </button>
              </li>
            </ul>

            <p
              class="header-search-empty"
              *ngIf="menuSearchFocused && menuSearchQuery.trim() && !menuSearchSuggestions.length">
              No menu items match your search.
            </p>
          </div>

          <button type="button" class="header-icon-btn" aria-label="Notifications" title="Notifications">
            <mat-icon>notifications_none</mat-icon>
            <span class="notify-dot" aria-hidden="true"></span>
          </button>

          <div class="header-user">
            <span class="header-user-name">{{ firstname || 'User' }}</span>
            <img
              class="header-avatar"
              [src]="'https://ui-avatars.com/api/?name=' + (firstname || 'User') + '&background=' + (themeService.isDark ? '6E00B3' : 'f97316') + '&color=fff&rounded=true'"
              alt="User avatar" />
          </div>
        </div>
      </header>

      <div class="content-area emis-page-content" [class.content-area--login]="isLoginPage">
        <main class="page-outlet-wrapper">
          <router-outlet></router-outlet>
        </main>

        <div class="footer-wrap" *ngIf="!isLoginPage">
          <footer class="modern-footer">
            <p>&copy; 2025 Designed & Developed by <span class="highlight">IT-Cell CGMSCL</span></p>
          </footer>
        </div>
      </div>
    </mat-drawer-content>
  </mat-drawer-container>
</div>

<div class="emis-app-shell">
  <ngx-spinner bdColor="rgba(0, 0, 0, 0.8)" size="medium" color="#fff" type="line-scale-party" [fullScreen]="true">
    <p style="color: white"> Please wait... </p>
  </ngx-spinner>

  <mat-toolbar class="header-toolbar app-header" *ngIf="!isLoginPage">
    <button
      type="button"
      mat-stroked-button
      class="sidebar-toggle-btn"
      (click)="toggleDrawer()"
      [attr.aria-expanded]="isDrawerOpen"
      [attr.aria-label]="isDrawerOpen ? 'Close sidebar menu' : 'Open sidebar menu'">
      <mat-icon>{{ isDrawerOpen ? 'chevron_left' : 'menu' }}</mat-icon>
      <span class="sidebar-toggle-label">{{ isDrawerOpen ? 'Close' : 'Menu' }}</span>
    </button>

    <span class="title">EMIS</span>
    <span class="spacer"></span>

    <div class="user-profile">
      <span class="welcome-text">Hi, {{firstname}}</span>
      <div class="avatar-container">
        <img src="https://ui-avatars.com/api/?name={{firstname}}&background=38bdf8&color=fff&rounded=true"
             alt="User" class="avatar-img shadow-sm">
        <div class="pulse-ring"></div>
      </div>
    </div>

    <button mat-button class="glass-back-btn" (click)="goBack()">Back</button>
  </mat-toolbar>

  <mat-drawer-container
    class="main-container"
    [class.main-container--login]="isLoginPage"
    [autosize]="true">

    <mat-drawer
      #drawer
      class="premium-drawer"
      [mode]="drawerMode"
      [opened]="isDrawerOpen && !isLoginPage"
      (openedChange)="onDrawerOpenedChange($event)">
      <div class="sidebar-header">
        <h2 class="brand-text">EMIS <span>Portal</span></h2>
        <button
          type="button"
          mat-icon-button
          class="sidebar-close-btn"
          (click)="closeDrawer()"
          aria-label="Close sidebar">
          <mat-icon>close</mat-icon>
        </button>
      </div>

      <mat-nav-list>
        <ng-container *ngFor="let item of menuItems">
          <mat-list-item class="nav-item">
            <button mat-button class="menu-btn"
                    (click)="item.submenu ? toggleSubmenu(item.label) : closeDrawerOnNavigate()"
                    [routerLink]="!item.submenu ? item.route : null"
                    routerLinkActive="active-menu"
                    [ngClass]="{'active-menu1': isMenuActive(item)}">

              <div class="menu-content">
                <div class="active-dot" *ngIf="isMenuActive(item)"></div>

                <mat-icon class="left-icon" [ngClass]="{'active-icon': isMenuActive(item)}">format_list_bulleted</mat-icon>
                <span class="menu-text" [ngClass]="{'active-text': isMenuActive(item)}">{{ item.label }}</span>

                <mat-icon *ngIf="item.submenu" class="right-icon" [class.rotate]="expandedMenus[item.label]">
                  chevron_right
                </mat-icon>
              </div>
            </button>
          </mat-list-item>

          <div class="submenu" [class.open]="expandedMenus[item.label]">
            <mat-list-item *ngFor="let sub of item.submenu; let i = index" class="sub-nav-item" [style.transition-delay]="(i * 0.05) + 's'">
              <button mat-button class="submenu-btn"
                      [routerLink]="sub.route"
                      routerLinkActive="active-submenu"
                      (click)="closeDrawerOnNavigate()">
                <div class="menu-content">
                  <mat-icon class="sub-icon">remove</mat-icon>
                  <span class="menu-text">{{ sub.label }}</span>
                </div>
              </button>
            </mat-list-item>
          </div>
        </ng-container>

        <div class="divider"></div>

        <mat-list-item class="nav-item">
          <button mat-button class="menu-btn logout-btn" (click)="logout(); closeDrawerOnNavigate()">
            <div class="menu-content">
              <mat-icon class="left-icon">power_settings_new</mat-icon>
              <span class="menu-text">Secure Logout</span>
            </div>
          </button>
        </mat-list-item>
      </mat-nav-list>
    </mat-drawer>

    <mat-drawer-content class="main-drawer-content">
      <div class="content-area emis-page-content" [class.content-area--login]="isLoginPage">
        <main class="page-outlet-wrapper">
          <router-outlet></router-outlet>
        </main>

        <div class="footer-wrap" *ngIf="!isLoginPage">
          <footer class="modern-footer">
            <p>&copy; 2025 Designed & Developed by <span class="highlight">IT-Cell CGMSCL</span></p>
          </footer>
        </div>
      </div>
    </mat-drawer-content>
  </mat-drawer-container>
</div>

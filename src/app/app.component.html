<mat-drawer-container class="main-container">
  
  <ngx-spinner bdColor="rgba(0, 0, 0, 0.8)" size="medium" color="#fff" type="line-scale-party" [fullScreen]="true">
    <p style="color: white"> Please wait... </p>
  </ngx-spinner>

  <mat-drawer #drawer mode="over" class="premium-drawer">
    <div class="sidebar-header">
      <h2 class="brand-text">EMIS <span>Portal</span></h2>
    </div>

    <mat-nav-list>

      <ng-container *ngFor="let item of menuItems">
        <mat-list-item class="nav-item">
          <button mat-button class="menu-btn"
                  (click)="item.submenu ? toggleSubmenu(item.label) : drawer.close()"
                  [routerLink]="!item.submenu ? item.route : null"
                  routerLinkActive="active-menu"
                  [ngClass]="{'active-menu1': isMenuActive(item)}">

            <div class="menu-content">
              <div class="active-dot" *ngIf="isMenuActive(item)"></div>
              
              <mat-icon class="left-icon" [ngClass]="{'active-icon': isMenuActive(item)}">format_list_bulleted</mat-icon>
              <span class="menu-text" [ngClass]="{'active-text': isMenuActive(item)}">{{ item.label }}</span>
              
              <mat-icon *ngIf="item.submenu" class="right-icon" [class.rotate]="expandedMenus[item.label]">
                chevron_right
              </mat-icon>
            </div>

          </button>
        </mat-list-item>

        <div class="submenu" [class.open]="expandedMenus[item.label]">
          <mat-list-item *ngFor="let sub of item.submenu; let i = index" class="sub-nav-item" [style.transition-delay]="(i * 0.05) + 's'">
            <button mat-button class="submenu-btn"
                    [routerLink]="sub.route"
                    routerLinkActive="active-submenu"
                    (click)="drawer.close()">
              
              <div class="menu-content">
                <mat-icon class="sub-icon">remove</mat-icon> <span class="menu-text">{{ sub.label }}</span>
              </div>

            </button>
          </mat-list-item>
        </div>
      </ng-container>

      <div class="divider"></div>

      <mat-list-item class="nav-item">
        <button mat-button class="menu-btn logout-btn" (click)="logout(); drawer.close()">
          <div class="menu-content">
            <mat-icon class="left-icon">power_settings_new</mat-icon> 
            <span class="menu-text">Secure Logout</span>
          </div>
        </button>
      </mat-list-item>

    </mat-nav-list>
  </mat-drawer>

  <mat-drawer-content>
    
    <mat-toolbar class="header-toolbar" *ngIf="!isLoginPage">
      <button mat-icon-button class="menu-toggle" (click)="drawer.toggle()">
        <mat-icon>menu_open</mat-icon>
      </button>

      <span class="title">EMIS</span>
      <span class="spacer"></span>

      <div class="user-profile">
        <span class="welcome-text">Hi, {{firstname}}</span>
        <div class="avatar-container">
          <img src="https://ui-avatars.com/api/?name={{firstname}}&background=38bdf8&color=fff&rounded=true" 
               alt="User" class="avatar-img shadow-sm">
          <div class="pulse-ring"></div>
        </div>
      </div>
      
      <button mat-button class="glass-back-btn" (click)="goBack()">Back</button>
    </mat-toolbar>

    <div class="content-area">
      <router-outlet></router-outlet>
      
      <div class="pt-4">
        <footer class="modern-footer fixed-bottom">
          <p>&copy; 2025 Designed & Developed by <span class="highlight">IT-Cell CGMSCL</span></p>
        </footer>
      </div>
    </div>
  </mat-drawer-content>

</mat-drawer-container>
